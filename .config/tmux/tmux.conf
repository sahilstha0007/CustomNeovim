set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Prefix key
set -g prefix C-a
set -g prefix2 None
unbind C-b
bind C-a send-prefix

# Setup tmux theme
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Styled popups: rounded borders, themed colors
set -g popup-border-lines rounded
set -g popup-style "fg=#{@thm_fg},bg=#{@thm_bg}"

set -g status-left-length 150
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[fg=#{@thm_bg},bold]  #S },#{#[fg=#{@thm_green}]  #S }}"
set -ga status-left "#[fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[fg=#{@thm_blue}]  󰉋 #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?pane_in_mode,#[fg=#{@thm_red}]#[bold]  COPY #[none],#[fg=#{@thm_overlay_0}]│}"
set -ga status-right "#[fg=#{@thm_yellow}]#(cut -d' ' -f1 /proc/loadavg) "
set -ga status-right "#[fg=#{@thm_overlay_0}]│"
set -ga status-right "#[fg=#{@thm_green}]   #(date '+%a %d %b %H:%M')"
set -g status-interval 5
set -g status-position bottom
set -g status-justify "absolute-centre"

# Pill-shaped tabs: rounded with Powerline glyphs, filled bg for current
set -g window-status-format "#[fg=#{@thm_surface_2},bg=#{@thm_bg}]#[fg=#{@thm_overlay_1},bg=#{@thm_surface_0}] #I #[fg=#{@thm_subtext_0},bg=#{@thm_surface_0}]#{?#{!=:#{window_name},Window},#W,}#{?window_activity_flag,#[fg=#{@thm_yellow}]•,#{?window_bell_flag,#[fg=#{@thm_red}]!,}}#[fg=#{@thm_surface_2},bg=#{@thm_bg}] "
set -g window-status-style "none"
set -g window-status-last-style "none"
set -g window-status-activity-style "fg=#{@thm_red},bg=#{@thm_surface_0},bold"
set -g window-status-bell-style "fg=#{@thm_red},bg=#{@thm_surface_0},bold"
set -gF window-status-separator ""
set -g window-status-current-format "#[fg=#{@thm_blue},bg=#{@thm_bg}]#[fg=#{@thm_bg},bg=#{@thm_blue},bold] #I #[fg=#{@thm_bg}]#{?#{!=:#{window_name},Window},#W,}#[fg=#{@thm_blue},bg=#{@thm_bg}] "
set -g window-status-current-style "none"
set -wg automatic-rename on
set -g automatic-rename-format "Window"

# Undercurl
set -g default-terminal "tmux-256color"
# Truecolor for ANY capable outer terminal (kitty, wezterm TERM=xterm-256color,
# ghostty). nvim renders 24-bit colors inside tmux only if tmux knows the
# outer terminal supports Tc.
set -as terminal-overrides ',*:Tc'
# Cursor shape: the outer terminal's terminfo may lack Ss/Se, so tmux can't
# switch cursor styles (nvim insert-mode beam, etc). Teach it regardless of
# which emulator is outside.
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Allow OSC passthrough (kitty supports it)
set -g allow-passthrough on

# Toggle tmux status bar
bind '\' set status
if-shell "[[ $(tmux lsw | wc -l) -le 1 ]]" 'set -g status'

set -g status on

# Enable mouse
set -g mouse on

# Increase history limit
set -g history-limit 30000

# Start windows and panes at 1 and not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Zero-out escape time delay for quicker response
set -s escape-time 0

# keybindings
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# Pane navigation (C-hjkl), resize (M-hjkl) and swap (C-M-hjkl) are provided
# by the aserowy/tmux.nvim TPM plugin — nvim-aware, no manual bindings needed.

# Open the new panes in the current path
bind v split-window -v -c "#{pane_current_path}" \; run-shell "~/.config/tmux/hooks/update-pane-status.sh"
bind h split-window -h -c "#{pane_current_path}" \; run-shell "~/.config/tmux/hooks/update-pane-status.sh"

# New windows also follow the current pane's path
bind c new-window -c "#{pane_current_path}"

# Update pane status based on number of panes
unbind x
bind x kill-pane \; run-shell "~/.config/tmux/hooks/update-pane-status.sh"
set-hook -g pane-exited 'run-shell "~/.config/tmux/hooks/update-pane-status.sh"'

# Sessionizer: fzf popup over ~/Projects, opens/switches to a session per project
bind f display-popup -t "  Projects " -E "~/.config/tmux/sessionizer.sh"

# If this is your first time using tmux, you will need to press (Ctrl + Space) + I to fetch the plugins.
run '~/.config/tmux/plugins/tpm/tpm'

# Load catppuccin flavor-specific theme based on @catppuccin_flavor
run-shell "tmux show -gqv @catppuccin_flavor | xargs -I {} tmux source-file ~/.config/tmux/plugins/tmux/themes/catppuccin_{}_tmux.conf"
# Override with matugen wallpaper colors (regenerated on wallpaper change)
source-file -q ~/.config/tmux/colors-matugen.conf
# Apply base colors to status bar and pane borders
set -g status-style "fg=#{@thm_fg}"
set -g message-style "fg=#{@thm_blue},bg=#{@thm_surface_0},bold"
set -g message-command-style "fg=#{@thm_red},bg=#{@thm_surface_0},bold"
set -g mode-style "fg=#{@thm_bg},bg=#{@thm_blue}"
set -g pane-border-style "fg=#{@thm_surface_2}"
set -g pane-active-border-style "fg=#{@thm_blue}"
# Pane dividers: popups support `rounded`, pane-border-lines does not on this
# tmux build (single/double/heavy/simple/number/spaces only) — so keep single
# and let the colored pane-border-style carry the look.
set -g pane-border-lines single
# Clock mode: themed — adopt the wallpaper blue token (was the ANSI color
# named "blue", which ignored the matugen palette). `-gF` is required: colour
# options expand formats at set time, plain `set -g` silently rejects them.
set -gF clock-mode-colour "#{@thm_blue}"
set -g clock-mode-style 24

# ============================================================
# best-way additions (previous file: tmux.conf.bak-<date>)
# ============================================================

# Focus events: nvim's FocusGained/checktime autoreload and tmux.nvim sync
# depend on the terminal reporting focus changes.
set -g focus-events on

# Force full repaint when a client attaches or resizes — fixes stale
# dotted/garbled regions after window restore or half-screen stretching.
set-hook -g client-attached 'refresh-client'
set-hook -g client-resized  'refresh-client'

# OSC52 clipboard: copy-mode yanks go straight to the OS clipboard
# (Ghostty/kitty support this). Combined with tmux 3.2+ `y` binding.
set -g set-clipboard on

# vi copy-mode: without this the copy-mode-vi binds below never fire,
# because tmux defaults to emacs keys in copy mode.
set -g mode-keys vi
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# vi-style copy mode selections (defaults on tmux 3.2+, harmless re-bind):
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# C-a C-a jumps to the last window (double-prefix trick)
bind -T prefix C-a last-window

# resurrect: also save pane contents + shell history, so in-progress work
# in any pane survives restarts.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dump-shell-history 'on'
# Restore nvim sessions (mksession) on resurrect/continuum restore.
set -g @resurrect-strategy-nvim 'session'
